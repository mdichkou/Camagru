ServerName localhost
# Preserve useful access evidence without logging activation/recovery query tokens.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" combined
<Directory /var/www/html>
    Options -Indexes
</Directory>
<DirectoryMatch "^/var/www/html/(config|docker|tests)(/|$)">
    Require all denied
</DirectoryMatch>
<Directory /var/www/html/uploads>
    php_admin_flag engine off
    <FilesMatch "\.(php[0-9]?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
