services:
  web:
    build: .
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: camagru
      DB_USER: camagru
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_URL: ${APP_URL:-http://localhost:8080}
    volumes:
      - photos:/var/www/html/uploads
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/home.php') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
  db:
    image: mysql:8.0.45-oraclelinux9
    environment:
      MYSQL_DATABASE: camagru
      MYSQL_USER: camagru
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  mailpit:
    image: axllent/mailpit:v1.30.7
    ports:
      - "127.0.0.1:${MAIL_PORT:-8025}:8025"
volumes:
  database:
  photos:
